<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>NexPanel · 多节点管理与代理面板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='1' y='1' width='30' height='30' rx='8' fill='url(%23g)'/%3E%3Cpath d='M16 16V9.8M16 16l-4.9 3.5M16 16l4.9 3.5' stroke='%23fff' stroke-width='2.1' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='3.1' fill='%23fff'/%3E%3Ccircle cx='16' cy='8' r='2.2' fill='%23fff'/%3E%3Ccircle cx='9.8' cy='20.6' r='2.2' fill='%23fff'/%3E%3Ccircle cx='22.2' cy='20.6' r='2.2' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css?v=20260829b">
<script>try{var t=localStorage.getItem("nexp_theme");if(t==="light"||(!t&&window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches))document.documentElement.classList.add("light")}catch(e){}</script>
</head>
<body>

<!-- ═══════════ 登录页 ═══════════ -->
<div id="login" class="login-wrap hidden">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 12 12 5.2M12 12 5.4 16.6M12 12 18.6 16.6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="2.9" fill="#fff"/><circle cx="12" cy="4.6" r="2" fill="#fff" opacity=".96"/><circle cx="5" cy="17" r="2" fill="#fff" opacity=".96"/><circle cx="19" cy="17" r="2" fill="#fff" opacity=".96"/></svg></div>
      <div>
        <h1>NexPanel</h1>
        <p>多节点 · LXC · 代理部署 · 订阅中心</p>
      </div>
    </div>
    <form id="login-form">
      <label>用户名
        <input id="login-user" autocomplete="username" placeholder="admin" required>
      </label>
      <label>密码
        <input id="login-pass" type="password" autocomplete="current-password"
               placeholder="••••••••" required>
      </label>
      <button class="btn primary block" type="submit">登 录</button>
      <p id="login-error" class="login-error"></p>
    </form>
    <div class="login-hint">
      演示账号：<code>admin / admin123</code><span class="sep">·</span>
      只读体验：<code>ops / ops123</code>
    </div>
  </div>
  <p class="login-foot">NexPanel v0.1.0 — FastAPI + SQLite + Vanilla JS</p>
</div>

<!-- ═══════════ 主应用 ═══════════ -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><span class="logo sm"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 12 12 5.2M12 12 5.4 16.6M12 12 18.6 16.6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="2.9" fill="#fff"/><circle cx="12" cy="4.6" r="2" fill="#fff" opacity=".96"/><circle cx="5" cy="17" r="2" fill="#fff" opacity=".96"/><circle cx="19" cy="17" r="2" fill="#fff" opacity=".96"/></svg></span><b>NexPanel</b></div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div id="mode-badge" class="mode-badge"></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h2 id="page-title">概览</h2>
      <div class="topbar-right">
        <span id="net-chip" class="chip mono hidden"></span>
        <div class="user-chip">
          <span id="who-avatar" class="avatar">A</span>
          <div class="user-meta"><b id="who-name">-</b><i id="who-role">-</i></div>
        </div>
        <button id="btn-theme" class="btn ghost icon-only" title="切换浅色 / 深色主题">
          <svg id="ic-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg id="ic-sun" viewBox="0 0 24 24" class="hidden"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
        <button id="btn-logout" class="btn ghost icon-only" title="退出登录">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </header>
    <main id="content" class="content"></main>
  </div>
</div>

<div id="modals"></div>
<div id="toasts"></div>

<script src="/js/app.js?v=20260829d"></script>
</body>
</html>
